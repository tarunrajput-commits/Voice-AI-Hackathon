<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Voice Picker</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b1f24;--muted:#5f6b7a;--line:#e3e7ec;--accent:#0b6bcb;--good:#1a7f37;--hl:#fff4c2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1116;--panel:#161b22;--ink:#e6edf3;--muted:#9aa7b4;--line:#2a313b;--accent:#4c9aff;--good:#3fb950;--hl:#3a3000}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0}
header a{margin-left:auto;color:var(--accent);font-weight:600;text-decoration:none}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.line{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.line small{color:var(--muted);display:block;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card.current{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
.card b{font-size:14px}
.meta{color:var(--muted);font-size:12px}
audio{width:100%}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.btn{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font:inherit;font-weight:600}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--hl)}
.fast{color:var(--good);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Bot voice picker</h1>
  <span class="tag" id="now">current: …</span>
  <a href="/">← Bot console</a>
</header>
<div class="wrap">
  <div class="line"><small>Every sample speaks the same line, a typical bot sentence in Hindi with English product words:</small><span id="text"></span></div>
  <div class="grid" id="grid"></div>
</div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let current = {};
async function load() {
  const [data, cur] = await Promise.all([fetch("/voices/voices.json").then(r => r.json()), fetch("/api/voice").then(r => r.json())]);
  current = cur;
  document.getElementById("text").textContent = data.text;
  document.getElementById("now").textContent = `current: ${cur.model} · ${cur.speaker}`;
  const base = data.voices.find(v => v.model === "bulbul:v3");
  document.getElementById("grid").innerHTML = data.voices.map(v => {
    const isCur = v.model === cur.model && v.speaker === cur.speaker;
    const faster = base && v !== base ? Math.round(100 * (1 - v.ms / base.ms)) : null;
    return `<div class="card ${isCur ? "current" : ""}">
      <div class="row"><b>${esc(v.speaker)}</b>${isCur ? '<span class="tag">in use</span>' : ""}</div>
      <div class="meta">${esc(v.model)} · ${esc(v.desc)} · generated in ${v.ms} ms
        ${faster !== null && faster > 0 ? `<span class="fast">(${faster}% faster than v3)</span>` : ""}</div>
      <audio controls preload="none" src="/voices/${encodeURIComponent(v.file)}"></audio>
      <div class="row"><span></span><button class="btn ${isCur ? "" : "primary"}" ${isCur ? "disabled" : ""}
        onclick="use('${esc(v.model)}','${esc(v.speaker)}')">${isCur ? "Selected" : "Use this voice"}</button></div>
    </div>`;
  }).join("");
  document.querySelectorAll("audio").forEach(a => a.addEventListener("play", () =>
    document.querySelectorAll("audio").forEach(o => o !== a && o.pause())));
}
async function use(model, speaker) {
  await fetch("/api/voice", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({model, speaker})});
  load();
}
load();
</script>
</body>
</html>
